<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reading Watch Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; width: 250px; }
    h2 { font-size: 1.2em; margin-bottom: 10px; }
    button { margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Reading Watch Tracker</h2>
  <p id="status">Track your reading time on this page.</p>
  <button id="startBtn">Start</button>
  <button id="stopBtn">Stop</button>
  <div id="timer" style="margin-top:10px;">Time: 0s</div>
  <script src="popup.js"></script>
</body>
</html>
