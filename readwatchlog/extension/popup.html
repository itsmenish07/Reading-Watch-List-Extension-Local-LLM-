<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 420px;
      min-height: 600px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .ai-status {
      font-size: 11px;
      padding: 6px 12px;
      margin: 8px auto;
      border-radius: 15px;
      max-width: 200px;
      transition: all 0.3s ease;
    }
    
    .ai-status.loading {
      background: rgba(255, 193, 7, 0.3);
      border: 1px solid rgba(255, 193, 7, 0.5);
    }
    
    .ai-status.ready {
      background: rgba(76, 175, 80, 0.3);
      border: 1px solid rgba(76, 175, 80, 0.5);
    }
    
    .ai-status.error {
      background: rgba(244, 67, 54, 0.3);
      border: 1px solid rgba(244, 67, 54, 0.5);
    }
    
    .tabs {
      display: flex;
      background: rgba(255,255,255,0.1);
    }
    
    .tab {
      flex: 1;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      border: none;
      background: none;
      color: white;
      transition: background 0.2s;
      font-size: 12px;
    }
    
    .tab.active {
      background: rgba(255,255,255,0.2);
      border-bottom: 2px solid #4CAF50;
    }
    
    .content {
      max-height: 450px;
      overflow-y: auto;
      padding: 0;
    }
    
    .entry {
      background: rgba(255,255,255,0.1);
      margin: 8px;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #4CAF50;
      transition: transform 0.2s ease;
    }
    
    .entry:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.15);
    }
    
    .entry.video {
      border-left-color: #FF5722;
    }
    
    .entry-title {
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 13px;
      line-height: 1.3;
      cursor: pointer;
    }
    
    .entry-title:hover {
      text-decoration: underline;
    }
    
    .entry-summary {
      font-size: 11px;
      opacity: 0.85;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    
    .entry-meta {
      font-size: 10px;
      opacity: 0.7;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .delete-btn {
      background: #ff4444;
      border: none;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 9px;
      transition: background 0.2s;
    }
    
    .delete-btn:hover {
      background: #cc0000;
    }
    
    .empty {
      text-align: center;
      padding: 60px 20px;
      opacity: 0.6;
    }
    
    .stats {
      display: flex;
      justify-content: space-around;
      padding: 10px;
      background: rgba(0,0,0,0.1);
      font-size: 11px;
    }
    
    .stat {
      text-align: center;
    }
    
    .stat-number {
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>🧠 AI Reading Tracker</h2>
    <div class="ai-status loading" id="aiStatus">🤖 Loading AI models...</div>
  </div>
  
  <div class="stats" id="stats">
    <div class="stat">
      <div class="stat-number" id="totalCount">0</div>
      <div>Total</div>
    </div>
    <div class="stat">
      <div class="stat-number" id="articleCount">0</div>
      <div>Articles</div>
    </div>
    <div class="stat">  
      <div class="stat-number" id="videoCount">0</div>
      <div>Videos</div>
    </div>
  </div>
  
  <div class="tabs">
    <button class="tab active" data-filter="all">All</button>
    <button class="tab" data-filter="article">Articles</button>
    <button class="tab" data-filter="video">Videos</button>
  </div>
  
  <div class="content" id="content">
    <div class="empty">Browse articles and videos to see your AI-powered reading list!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
