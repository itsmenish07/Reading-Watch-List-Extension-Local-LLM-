<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Readings & Watch List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <div class="logo">Your Readings & Watch List</div>
        </nav>
    </header>

    <main class="main-container">
        <div class="controls">
            <div class="viewing-text" id="viewingText">Viewing: <strong>All</strong></div>
            <button class="filter-btn" onclick="toggleFilter()">🔽 Filter</button>
        </div>

        <div class="card-grid" id="cardGrid"></div>
    </main>

    <script src="main.js"></script>
</body>
</html>
